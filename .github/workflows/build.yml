name: Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  release:
    types: [created, modified]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
        variant: [standard, kiosk]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - name: Install
      run: npm install
    - name: Build (${{ matrix.variant }})
      run: |
        if [ "${{ matrix.variant }}" = "kiosk" ]; then
          npm run build:kiosk
        else
          npm run build
        fi
    - uses: actions/upload-artifact@v4
      if: startsWith(github.ref, 'refs/tags/')
      with:
        name: dist-${{ matrix.variant }}
        path: ./dist
        retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package release zips
        run: |
          ls -alFh artifacts/
          cd artifacts/dist-standard/webshark && zip -r "$GITHUB_WORKSPACE/latest_raw.zip" .
          cd "$GITHUB_WORKSPACE/artifacts/dist-kiosk/webshark" && zip -r "$GITHUB_WORKSPACE/latest.zip" .
          ls -alFh "$GITHUB_WORKSPACE"/*.zip
      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            latest.zip
            latest_raw.zip
